name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # 한 버전에서만 깨지는 문제와 전부 깨지는 문제를 구분하려면 모든 결과가 필요하다.
      fail-fast: false
      matrix:
        # engines(>=14) 가 약속하는 메이저 전부. 새 메이저가 나오면 여기 더한다 — 규칙은 CLAUDE.md.
        node: [14, 16, 18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      # 설치는 새 npm 으로 한다 — Node 14 의 npm 6 은 lockfileVersion 3 을 못 읽는다(실측).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 테스트·빌드는 매트릭스 버전으로 — 여기서부터 PATH 의 node 가 바뀐다.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: node --version

      # tests/*.test.js 전체 + tsc --noEmit. 하나라도 실패하면 non-zero.
      - run: npm test

      # 빌드는 "에러 없이 끝나는가" 만 확인하고 산출물은 버린다.
      #
      # dist/ 를 커밋된 것과 비교하지 마라. 빌드 헤더의 `Built:` 타임스탬프는 사람이 이
      # 빌드를 배포하기로 결정한 시점을 기록하는 의도된 설계라 재빌드하면 항상 diff 가
      # 난다. `git diff --exit-code dist` 를 여기 추가하면 CI 가 영구히 깨진다.
      - run: node build.js && node build-types.js
